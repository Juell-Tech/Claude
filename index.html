<style>
  :root{
    --ink:#FFFFFF;
    --ink-text:#1A0000;
    --card:#241010;
    --card-hi:#2C1414;
    --brass:#C21A1A;
    --brass-bright:#E8483F;
    --brass-shadow:#7A0E0E;
    --brass-deep:#C21A1A;
    --paper:#F7F7F7;
    --slate:#B08A8A;
    --slate-dim:#6E4A4A;
    --brick:#3A0A0A;
    --line: rgba(247,247,247,0.08);
  }
  html{ color-scheme: light; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button{
    -webkit-appearance:none;
    appearance:none;
    font:inherit;
    color:inherit;
  }
  html,body{
    margin:0; padding:0;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--ink);
    color:var(--ink-text);
    font-family:'Poppins', sans-serif;
    overscroll-behavior-y:none;
  }
  body{
    display:flex; flex-direction:row;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ===== Left sidebar: vertical entries list ===== */
  .sidebar{
    width:128px;
    flex-shrink:0;
    display:flex; flex-direction:column;
    background:var(--brass);
    border-right:1px solid var(--line);
    height:100%;
    min-height:0;
  }
  .sidebar-head{
    padding:16px 10px 8px;
    text-align:center;
    flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .sidebar-title{
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--paper); font-weight:600;
  }
  .sidebar-actions{
    display:flex; flex-direction:column; gap:6px;
    margin-top:10px;
  }
  .show-all-btn, .clear-btn{
    width:100%;
    background:none;
    border:1px solid rgba(255,255,255,0.35); border-radius:14px;
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace; font-size:9.5px;
    letter-spacing:0.04em; cursor:pointer; padding:5px 4px;
  }
  .show-all-btn.active{
    background:var(--paper); color:#1A0000; border-color:var(--paper);
  }
  .clear-btn{ color:rgba(255,255,255,0.85); }
  .clear-btn:active{ color:#1A0000; border-color:#1A0000; background:rgba(255,255,255,0.9); }

  .entries{
    flex:1 1 0;
    min-height:0;
    overflow-y:auto;
    padding:10px 8px 20px;
    -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:8px;
  }
  .entry{
    display:flex; flex-direction:column; gap:4px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:10px;
    padding:9px 9px 7px;
    position:relative;
  }
  .entry-dur{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px; font-weight:600; color:var(--paper);
    line-height:1.1;
  }
  .entry-range{
    font-size:10px; color:var(--paper); font-weight:500;
    line-height:1.35;
  }
  .entry-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; color:rgba(255,255,255,0.75); letter-spacing:0.03em;
  }
  .entry-studies{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; color:#1A0000; background:rgba(255,255,255,0.85);
    border-radius:5px; padding:2px 5px; margin-top:2px;
    display:inline-block; font-weight:600; letter-spacing:0.02em;
  }
  .del-btn{
    position:absolute; top:5px; right:6px;
    background:none; border:none; color:rgba(255,255,255,0.7);
    font-size:12px; line-height:1; cursor:pointer; padding:2px;
  }
  .del-btn:active{ color:#1A0000; }

  .empty{
    text-align:center;
    color:rgba(255,255,255,0.75);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    padding:20px 6px;
    line-height:1.7;
  }

  /* ===== Right side: header, clock, controls ===== */
  .main{
    flex:1 1 0;
    min-width:0;
    min-height:0;
    height:100%;
    background:var(--ink);
    display:flex; flex-direction:column;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  .header{
    text-align:center;
    padding:8px 20px 6px;
    flex-shrink:0;
  }
  .badge{
    width:90px; height:90px;
    margin:0 auto 6px;
    display:block;
    border-radius:50%;
  }
  .eyebrow{
    font-family:'Caveat', cursive;
    font-size:22px;
    letter-spacing:0.02em;
    color:var(--brass-deep);
    font-weight:600;
    text-transform:none;
  }
  .title{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.01em;
    margin-top:4px;
    color:#3FA9F5;
  }

  /* Clock face */
  .clock-wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:2px 20px 4px;
    flex-shrink:0;
    width:100%;
  }
  .face{
    width:100%;
    max-width:204px;
    background:linear-gradient(180deg, var(--brass) 0%, var(--brass-shadow) 100%);
    border-radius:12.6px;
    padding:12px 12.6px 10px;
    box-shadow:
      inset 0 0 0 1px rgba(243,239,228,0.06),
      inset 0 2px 6px rgba(0,0,0,0.5),
      0 10px 30px rgba(0,0,0,0.35);
    position:relative;
  }
  .face::before{
    content:"";
    position:absolute; top:10px; left:10px; right:10px; bottom:10px;
    border:1px dashed rgba(255,255,255,0.25);
    border-radius:12px;
    pointer-events:none;
  }
  .digits{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:24.4px;
    letter-spacing:0.02em;
    text-align:center;
    font-variant-numeric: tabular-nums;
    color:var(--paper);
    text-shadow:0 2px 6px rgba(0,0,0,0.35);
    transition:color .2s ease;
  }
  .digits.idle{ color:rgba(247,247,247,0.55); text-shadow:none; }
  .digits.running{ color:var(--paper); text-shadow:0 0 18px rgba(255,255,255,0.4); }

  .status-row{
    display:flex; justify-content:center; align-items:center; gap:6px;
    margin-top:6px;
  }
  .status-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--slate-dim);
  }
  .status-dot.on{ background:#7BC47F; box-shadow:0 0 8px #7BC47F; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.35} }
  .status-text{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--slate);
  }

  /* Punch button */
  .btn-wrap{ display:flex; justify-content:center; padding:6px 20px 10px; flex-shrink:0; }
  .punch{
    width:58.9px; height:58.9px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    position:relative;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:7.7px;
    letter-spacing:0.04em;
    color:var(--paper);
    background:radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 70%);
    box-shadow:
      0 8px 0 var(--brass-shadow),
      0 12px 20px rgba(0,0,0,0.45);
    transform:translateY(0);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .punch:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 var(--brass-shadow), 0 4px 10px rgba(0,0,0,0.4);
  }
  .punch.running{
    background:radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 70%);
    box-shadow:0 8px 0 var(--brass-shadow), 0 12px 20px rgba(0,0,0,0.45);
    color:var(--paper);
  }
  .punch.running:active{
    box-shadow:0 2px 0 var(--brass-shadow), 0 4px 10px rgba(0,0,0,0.4);
  }
  .punch::after{
    content:"";
    position:absolute; inset:10px;
    border-radius:50%;
    border:1px solid rgba(27,33,48,0.25);
  }

  /* Total bar */
  .add-time-widget{
    margin:14px auto 0;
    max-width:204px;
    width:calc(100% - 40px);
    background:#FFFFFF;
    border:1px solid var(--brass-deep);
    border-radius:11.3px;
    padding:6px 11.7px;
    display:flex; flex-direction:column; align-items:center;
    gap:4px;
    flex-shrink:0;
  }
  .add-time-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:8.6px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--brass-deep); font-weight:600;
  }
  .add-time-row{
    display:flex; align-items:center; gap:5.4px;
  }
  .time-input{
    width:32px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:14.6px; font-weight:600;
    color:var(--brass-deep);
    background:#FFFFFF;
    border:1px solid var(--brass-deep);
    border-radius:6.5px;
    padding:4.9px 1.6px;
    -webkit-appearance:none;
    appearance:textfield;
  }
  .time-input::-webkit-inner-spin-button,
  .time-input::-webkit-outer-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .time-sep{
    font-family:'IBM Plex Mono', monospace;
    font-size:14.6px; font-weight:700; color:var(--brass-deep);
  }
  .add-time-btn{
    background:var(--brass);
    color:var(--paper);
    border:none;
    border-radius:6.5px;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:9.7px;
    letter-spacing:0.04em;
    padding:7.3px 11.7px;
    cursor:pointer;
  }
  .add-time-btn:active{ background:var(--brass-bright); }

  .total-bar{
    margin:20px 20px 30px;
    background:var(--card);
    border-radius:14px;
    padding:14px 18px;
    display:flex; justify-content:space-between; align-items:baseline;
    flex-shrink:0;
    border:1px solid var(--line);
  }
  .total-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--paper);
  }
  .total-value{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px; font-weight:600;
    color:var(--paper);
  }

  @media (max-width:360px){
    .sidebar{ width:108px; }
    .sidebar-right{ width:108px; }
  }

  /* ===== Right sidebar: monthly totals ===== */
  .sidebar-right{
    width:128px;
    flex-shrink:0;
    display:flex; flex-direction:column;
    background:var(--brass);
    border-left:1px solid var(--line);
    height:100%;
    min-height:0;
  }
  .month-list{
    flex:1 1 0;
    min-height:0;
    overflow-y:auto;
    padding:10px 8px 20px;
    -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:8px;
  }
  .month-card{
    display:flex; flex-direction:column; gap:4px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:10px;
    padding:9px 9px 7px;
  }
  .month-name{
    font-size:10px; color:var(--paper); font-weight:600;
    text-transform:uppercase; letter-spacing:0.04em;
    line-height:1.35;
  }
  .month-total{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px; font-weight:600; color:var(--paper);
    line-height:1.1;
  }

  /* ===== Studies odometer counter ===== */
  .studies-widget{
    padding:0 10px 0;
    margin-top:2px;
    margin-bottom:10px;
    flex-shrink:0;
    display:flex; flex-direction:column; align-items:center;
  }
  .studies-label{
    font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:rgba(26,0,0,0.75); font-weight:600;
    text-align:center; margin-bottom:8px;
  }
  .wheel-row{
    display:flex; align-items:center; gap:8px;
  }
  .wheel-btn{
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--brass-deep);
    background:#FFFFFF;
    color:var(--brass-deep);
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .wheel-btn:active{ background:#F0F0F0; }
  .wheel-window{
    width:30px; height:30px;
    overflow:hidden;
    background:#FFFFFF;
    border-radius:6px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.25);
    position:relative;
    flex-shrink:0;
  }
  .wheel-track{
    display:flex; flex-direction:column;
    transition:transform .22s cubic-bezier(.4,0,.2,1);
  }
  .wheel-digit{
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:17px; font-weight:600;
    color:var(--brass-deep);
  }
</style>
</head>

<script>
(function(){
  const digitsEl = document.getElementById('digits');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const punchBtn = document.getElementById('punchBtn');
  const totalValue = document.getElementById('totalValue');
  const entriesList = document.getElementById('entriesList');
  const clearBtn = document.getElementById('clearBtn');
  const monthList = document.getElementById('monthList');
  const wheelTrack = document.getElementById('wheelTrack');
  const studyUpBtn = document.getElementById('studyUpBtn');
  const studyDownBtn = document.getElementById('studyDownBtn');
  const showAllBtn = document.getElementById('showAllBtn');
  const addHoursInput = document.getElementById('addHours');
  const addMinutesInput = document.getElementById('addMinutes');
  const addTimeBtn = document.getElementById('addTimeBtn');

  let entries = [];
  let running = false;
  let startTime = null;
  let tickHandle = null;
  let showAll = false;
  let studyCount = 0;

  function renderWheel(animate){
    wheelTrack.style.transition = animate ? '' : 'none';
    wheelTrack.style.transform = 'translateY(' + (-studyCount * 30) + 'px)';
    if(!animate){
      void wheelTrack.offsetHeight;
      wheelTrack.style.transition = '';
    }
  }

  const ENTRIES_KEY = 'service-time:entries';
  const STATE_KEY = 'service-time:state';

  function pad(n){ return String(n).padStart(2,'0'); }

  function fmtClock(ms){
    const totalSec = Math.floor(ms/1000);
    const h = Math.floor(totalSec/3600);
    const m = Math.floor((totalSec%3600)/60);
    const s = totalSec%60;
    return pad(h)+':'+pad(m)+':'+pad(s);
  }

  function fmtDuration(ms){
    const totalMin = Math.round(ms/60000);
    const h = Math.floor(totalMin/60);
    const m = totalMin%60;
    return h+'h '+pad(m)+'m';
  }

  function fmtTime(d){
    let h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? 'p' : 'a';
    h = h % 12; if(h===0) h = 12;
    return h+':'+pad(m)+ampm;
  }

  function fmtDate(d){
    const dd = pad(d.getDate());
    const mm = pad(d.getMonth()+1);
    const yyyy = d.getFullYear();
    return dd+'/'+mm+'/'+yyyy;
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(ENTRIES_KEY);
      entries = raw ? JSON.parse(raw) : [];
    }catch(e){ entries = []; }
    try{
      const raw = localStorage.getItem(STATE_KEY);
      if(raw){
        const s = JSON.parse(raw);
        if(s.running && s.startTime){
          running = true;
          startTime = s.startTime;
        }
        studyCount = s.studyCount || 0;
      }
    }catch(e){ /* no running state */ }
    renderWheel(false);
    renderEntries();
    renderTotal();
      renderMonthlyTotals();
    if(running){ startTicking(); }
    updateButtonUI();
  }

  function saveEntries(){
    try{ localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); }
    catch(e){ console.error('save entries failed', e); }
  }

  function saveRunState(){
    try{
      localStorage.setItem(STATE_KEY, JSON.stringify({running, startTime, studyCount}));
    }catch(e){ console.error('save state failed', e); }
  }

  function updateButtonUI(){
    if(running){
      punchBtn.textContent = 'STOP';
      punchBtn.classList.add('running');
      digitsEl.classList.remove('idle');
      digitsEl.classList.add('running');
      statusDot.classList.add('on');
      statusText.textContent = 'Running';
    } else {
      punchBtn.textContent = 'START';
      punchBtn.classList.remove('running');
      digitsEl.classList.add('idle');
      digitsEl.classList.remove('running');
      statusDot.classList.remove('on');
      statusText.textContent = 'Stopped';
      digitsEl.textContent = '00:00:00';
    }
  }

  function tick(){
    const elapsed = Date.now() - startTime;
    digitsEl.textContent = fmtClock(elapsed);
  }

  function startTicking(){
    tick();
    tickHandle = setInterval(tick, 1000);
  }

  function stopTicking(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  function renderTotal(){
    const totalMs = entries.reduce((sum,e)=>sum+e.duration,0);
    totalValue.textContent = fmtDuration(totalMs);
  }

  function renderMonthlyTotals(){
    monthList.innerHTML = '';
    if(entries.length === 0){
      monthList.innerHTML = '<div class="empty">No months yet.</div>';
      return;
    }
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const totals = {};
    for(const e of entries){
      const d = new Date(e.start);
      const key = d.getFullYear()+'-'+pad(d.getMonth()+1);
      if(!totals[key]) totals[key] = { ms:0, studies:0, year:d.getFullYear(), month:d.getMonth() };
      totals[key].ms += e.duration;
      totals[key].studies += (e.studies || 0);
    }
    const keys = Object.keys(totals).sort().reverse();
    for(const key of keys){
      const t = totals[key];
      const card = document.createElement('div');
      card.className = 'month-card';
      card.innerHTML = `
        <div class="month-name">${monthNames[t.month]} ${t.year}</div>
        <div class="month-total">${fmtDuration(t.ms)}</div>
        <div class="entry-studies">${t.studies} ${t.studies === 1 ? 'study' : 'studies'}</div>
      `;
      monthList.appendChild(card);
    }
  }

  function renderEntries(){
    entriesList.innerHTML = '';
    if(entries.length === 0){
      entriesList.innerHTML = '<div class="empty">No entries yet. Tap START below.</div>';
      return;
    }

    const today = new Date().toDateString();
    const visible = showAll
      ? entries
      : entries.filter(e => new Date(e.start).toDateString() === today);

    if(visible.length === 0){
      entriesList.innerHTML = '<div class="empty">No entries today. Tap SHOW ALL for history.</div>';
      return;
    }

    const sorted = [...visible].sort((a,b)=>b.start-a.start);
    for(const e of sorted){
      const startD = new Date(e.start);
      const endD = new Date(e.end);
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <button class="del-btn" data-id="${e.id}">✕</button>
        <div class="entry-dur">${fmtDuration(e.duration)}</div>
        <div class="entry-range">${fmtTime(startD)}–${fmtTime(endD)}</div>
        <div class="entry-date">${fmtDate(startD)}</div>
        <div class="entry-studies">${e.studies || 0} ${(e.studies||0) === 1 ? 'study' : 'studies'}</div>
      `;
      entriesList.appendChild(row);
    }
    entriesList.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-id');
        entries = entries.filter(e=>String(e.id) !== id);
        saveEntries();
        renderEntries();
        renderTotal();
      renderMonthlyTotals();
      });
    });
  }

  punchBtn.addEventListener('click', ()=>{
    if(!running){
      running = true;
      startTime = Date.now();
      updateButtonUI();
      startTicking();
      saveRunState();
    } else {
      running = false;
      stopTicking();
      const end = Date.now();
      const entry = { id: end, start: startTime, end: end, duration: end - startTime, studies: studyCount };
      if(entry.duration >= 1000){
        entries.push(entry);
        saveEntries();
      }
      studyCount = 0;
      renderWheel(true);
      startTime = null;
      updateButtonUI();
      renderEntries();
      renderTotal();
      renderMonthlyTotals();
      saveRunState();
    }
  });

  showAllBtn.addEventListener('click', ()=>{
    showAll = !showAll;
    showAllBtn.textContent = showAll ? 'TODAY ONLY' : 'SHOW ALL';
    showAllBtn.classList.toggle('active', showAll);
    renderEntries();
  });

  let clearArmed = false;
  let clearArmTimeout = null;

  clearBtn.addEventListener('click', ()=>{
    if(entries.length === 0) return;

    if(!clearArmed){
      clearArmed = true;
      clearBtn.textContent = 'TAP TO CONFIRM';
      clearArmTimeout = setTimeout(()=>{
        clearArmed = false;
        clearBtn.textContent = 'CLEAR ALL';
      }, 3000);
      return;
    }

    clearTimeout(clearArmTimeout);
    clearArmed = false;
    clearBtn.textContent = 'CLEAR ALL';
    entries = [];
    saveEntries();
    renderEntries();
    renderTotal();
    renderMonthlyTotals();
  });

  studyUpBtn.addEventListener('click', ()=>{
    studyCount = (studyCount + 1) % 10;
    saveRunState();
    renderWheel(true);
  });

  studyDownBtn.addEventListener('click', ()=>{
    studyCount = (studyCount + 9) % 10;
    saveRunState();
    renderWheel(true);
  });

  addTimeBtn.addEventListener('click', ()=>{
    const h = Math.max(0, Math.min(99, parseInt(addHoursInput.value, 10) || 0));
    const m = Math.max(0, Math.min(59, parseInt(addMinutesInput.value, 10) || 0));
    const durationMs = (h * 60 + m) * 60000;
    if(durationMs <= 0) return;

    const end = Date.now();
    const start = end - durationMs;
    const entry = { id: end, start: start, end: end, duration: durationMs, studies: 0 };
    entries.push(entry);
    saveEntries();
    renderEntries();
    renderTotal();
    renderMonthlyTotals();

    addHoursInput.value = 0;
    addMinutesInput.value = 0;
  });

  loadState();
})();
</script>
</body>
</html>
